<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro 8-Bit Reminders</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body {
            font-family: 'Press Start 2P', system-ui, monospace;
            background-color: #4ec0f9; /* Light sky blue from reference */
            color: #000;
            overflow-x: hidden;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Thick black borders and sharp shadows typical of retro 8-bit UI */
        .retro-border {
            border: 4px solid #000;
            border-radius: 8px;
        }

        .retro-shadow {
            box-shadow: 6px 6px 0 0 #000;
        }

        .retro-shadow-sm {
            box-shadow: 4px 4px 0 0 #000;
        }

        /* Interactive button press effect */
        .retro-interactive {
            transition: transform 0.1s, box-shadow 0.1s;
            cursor: pointer;
        }

        .retro-interactive:active {
            box-shadow: 0px 0px 0 0 #000 !important;
            transform: translate(6px, 6px);
        }

        .retro-interactive-sm:active {
            box-shadow: 0px 0px 0 0 #000 !important;
            transform: translate(4px, 4px);
        }

        input:focus {
            outline: none;
        }

        .brick-floor {
            height: 64px;
            width: 100%;
            background-color: #d95700; /* Retro brown/orange */
            /* Creating a blocky pattern using linear gradients */
            background-image: 
                linear-gradient(90deg, #000 4px, transparent 4px),
                linear-gradient(0deg, #000 4px, transparent 4px);
            background-size: 64px 32px;
            border-top: 4px solid #000;
            position: fixed;
            bottom: 0;
            left: 0;
            z-index: 50;
        }
        
        /* Offset the second row of bricks to make it look like a real brick wall */
        .brick-floor::after {
            content: "";
            position: absolute;
            top: 32px;
            left: 0;
            width: 100%;
            height: 32px;
            background-image: linear-gradient(90deg, #000 4px, transparent 4px);
            background-size: 64px 32px;
            background-position: 32px 0;
        }

        /* Main content area padding to prevent overlap with the floor */
        .main-content {
            padding-bottom: 96px;
            flex-grow: 1;
        }
    </style>
</head>
<body>
    <div class="main-content flex flex-col items-center p-4 sm:p-8 w-full max-w-md mx-auto">
        
        <!-- Retro Orange Banner (Title) -->
        <div class="bg-[#f07d30] retro-border retro-shadow w-full p-6 text-center mt-4 mb-10">
            <h1 class="text-xl sm:text-2xl text-black leading-snug">
                REMINDERS
            </h1>
        </div>

        <!-- Input Area -->
        <div class="w-full flex flex-col gap-6 mb-10">
            <input 
                type="text" 
                id="reminderInput" 
                placeholder="TYPE HERE..." 
                class="w-full bg-white retro-border retro-shadow p-4 text-xs sm:text-sm text-black uppercase"
                autocomplete="off"
            >
            
            <button 
                id="addBtn" 
                class="bg-[#24d924] retro-border retro-shadow retro-interactive w-full py-4 flex justify-center items-center"
            >
                <span class="text-black text-sm sm:text-base">ADD</span>
            </button>
        </div>

        <!-- Reminder List -->
        <div class="w-full">
            <ul id="reminderList" class="flex flex-col gap-5 w-full">
                <!-- Reminders injected here via JavaScript -->
            </ul>
        </div>
        
        <!-- Trademark -->
        <div class="mt-auto pt-12 pb-4 text-center w-full">
            <p class="text-[10px] sm:text-xs text-black uppercase tracking-widest">MADE BY NEEV</p>
        </div>
        
    </div>

    <!-- Brick Floor Pattern -->
    <div class="brick-floor"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const input = document.getElementById('reminderInput');
            const addBtn = document.getElementById('addBtn');
            const list = document.getElementById('reminderList');
            
            // Array to store our reminder tasks, loaded from localStorage
            let reminders = JSON.parse(localStorage.getItem('retroReminders')) || [];

            // Initialize rendering
            renderReminders();

            // Event Listeners
            addBtn.addEventListener('click', handleAdd);
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') handleAdd();
            });

            // Function to handle adding new items
            function handleAdd() {
                const text = input.value.trim();
                if (text) {
                    reminders.push({
                        id: Date.now(),
                        text: text.toUpperCase()
                    });
                    input.value = '';
                    // Save to local storage
                    localStorage.setItem('retroReminders', JSON.stringify(reminders));
                    renderReminders();
                }
            }

            // Expose globally so the inline onclick in the generated HTML works
            window.deleteReminder = function(id) {
                reminders = reminders.filter(r => r.id !== id);
                // Update local storage
                localStorage.setItem('retroReminders', JSON.stringify(reminders));
                renderReminders();
            };

            // Main render function
            function renderReminders() {
                list.innerHTML = '';
                
                if (reminders.length === 0) {
                    list.innerHTML = '<li class="text-center text-black/50 text-xs mt-4">NO REMINDERS...</li>';
                    return;
                }

                reminders.forEach((reminder) => {
                    const li = document.createElement('li');
                    // Style each list item as a white chunky block
                    li.className = 'bg-white retro-border retro-shadow-sm p-4 flex items-center justify-between gap-4';
                    
                    li.innerHTML = `
                        <span class="text-black text-[10px] sm:text-xs leading-loose break-words flex-1">${escapeHTML(reminder.text)}</span>
                        
                        <button 
                            onclick="deleteReminder(${reminder.id})"
                            class="bg-[#ff3b3b] hover:bg-[#ff1a1a] text-black retro-border retro-shadow-sm retro-interactive-sm p-2 w-10 h-10 flex items-center justify-center flex-shrink-0"
                            title="Delete"
                        >
                            <span class="text-sm">X</span>
                        </button>
                    `;
                    list.appendChild(li);
                });
            }

            // Utility to prevent basic XSS when rendering user input
            function escapeHTML(str) {
                return str.replace(/[&<>'"]/g, 
                    tag => ({
                        '&': '&amp;',
                        '<': '&lt;',
                        '>': '&gt;',
                        "'": '&#39;',
                        '"': '&quot;'
                    }[tag] || tag)
                );
            }
        });
    </script>
</body>
</html>
